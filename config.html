<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Zuul ticket reader - setup</title>
  <!-- Teams refuses to save a configurable tab unless this page says it is valid. -->
  <script src="https://res.cdn.office.net/teams-js/2.22.0/js/MicrosoftTeams.min.js" crossorigin="anonymous"></script>
  <style>
    body { font-family: "Segoe UI", sans-serif; margin: 1.5rem; color: #242424; }
  </style>
</head>
<body>
  <h3>Zuul ticket reader</h3>
  <p>
    Adding this app lets the Zuul team's PO toolkit read the messages of this
    chat, so that issues reported here can be drafted into Jira tickets.
    It cannot post in the chat. Remove the app to revoke access.
  </p>
  <p>Select <b>Save</b> to continue.</p>

  <script>
    microsoftTeams.app.initialize().then(function () {
      var base = window.location.href.replace(/config\.html.*$/, "");
      microsoftTeams.pages.config.registerOnSaveHandler(function (saveEvent) {
        microsoftTeams.pages.config.setConfig({
          entityId: "cursor-teams-reader",
          contentUrl: base + "index.html",
          websiteUrl: base + "index.html",
          suggestedDisplayName: "Zuul ticket reader"
        }).then(function () {
          saveEvent.notifySuccess();
        });
      });
      microsoftTeams.pages.config.setValidityState(true);
    });
  </script>
</body>
</html>
